<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eQUILIBRIUM drawings</title>
<style>
  :root {
    --pink: #ce4095;
    --border: #e4e4e7;
    --text: #27272a;
    --muted: #71717a;
    --panel: #16181d;
    --panel-2: #22252b;
    --panel-border: #33373f;
    --panel-text: #d5d7db;
    --panel-muted: #8a8f98;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    font: 13px/1.45 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #111;
    background: #fff;
    overflow: hidden;
  }

  /* ---- sidebar: dark panel as in the reference video ---------------- */
  #sidebar {
    width: 250px;
    flex: none;
    overflow-y: auto;
    padding-bottom: 24px;
    background: var(--panel);
    color: var(--panel-text);
  }
  .panel-head { padding: 18px 16px 6px; }
  .panel-head h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
  .panel-head p { color: var(--panel-muted); font-size: 12px; margin-top: 3px; }
  .about { color: var(--panel-muted); font-size: 12px; line-height: 1.5; padding-bottom: 6px; }
  .panel-section { padding: 14px 16px 4px; border-top: 1px solid var(--panel-border); margin-top: 14px; }
  .panel-section h2 {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--panel-muted); margin-bottom: 10px;
  }
  .pylinks { font-size: 12px; padding-bottom: 8px; }
  .pylinks a { color: #ff7ec4; text-decoration: none; }
  .pylinks a:hover { text-decoration: underline; }
  .ctl { margin-bottom: 10px; }
  .ctl-head { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .ctl-head .val { color: var(--panel-muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--pink); }
  .ctl.toggle { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .ctl.toggle input { accent-color: var(--pink); }
  .btn {
    font: 11px/1 inherit; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    padding: 8px 10px; margin: 0 6px 8px 0;
    border: 1px solid var(--panel-border); border-radius: 0;
    background: var(--panel-2); color: var(--panel-text); cursor: pointer;
  }
  .btn:hover { border-color: #6a707b; }
  .btn.accent { border-color: var(--pink); color: #ff7ec4; font-weight: 700; }
  .btn-row { display: flex; flex-wrap: wrap; }
  .btn-row .btn { flex: 1; margin-right: 6px; text-align: center; }
  .btn-row .btn:last-child { margin-right: 0; }

  /* ---- view navigation ---------------------------------------------- */
  #viewnav {
    display: flex; gap: 6px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--panel-border);
  }
  #viewnav .btn { margin: 0; flex: none; padding: 6px 9px; }
  #viewnav .btn:disabled { opacity: 0.35; cursor: default; }
  #viewnav select {
    flex: 1; min-width: 0;
    font: 12px/1 inherit; font-weight: 500;
    padding: 6px 6px; border: 1px solid var(--panel-border); border-radius: 0;
    background: var(--panel-2); color: var(--panel-text); cursor: pointer;
  }

  /* ---- viewport ----------------------------------------------------- */
  #viewport { position: relative; flex: 1; min-width: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; }
  .eq-overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .eq-label {
    position: absolute; transform: translate(-50%, -50%);
    font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #55555c; white-space: nowrap;
    /* a halo, so a label stays readable wherever a line runs under it.
       Drawings are dense and a number struck through by its own member is
       worse than useless. */
    text-shadow:
      0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff,
      1px 0 2px #fff, -1px 0 2px #fff, 0 1px 2px #fff, 0 -1px 2px #fff;
  }
  .eq-label.title { font-size: 14px; font-weight: 650; color: #18181b; }
  .eq-label.point { font-size: 11px; color: #a0a0a7; }
  .eq-label.num { font-weight: 700; color: #18181b; }
  .eq-label.flash { color: #111; font-weight: 700; }
  .eq-label.hover { color: #c99700; }

  /* ---- the exercise task, pinned across the top of the viewport ----- */
  .eq-task {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 9px 18px 10px;
    background: #f7f8f9; border-bottom: 1px solid #e4e6e9;
    font-size: 12px; line-height: 1.5; color: #44474d;
    /* CAPPED, for the same reason the caption card is: the drawing below is
       composed against a known band, and a banner that grows with its text
       silently eats the top of every view. The caption card is pinned 76 px
       down, so anything past that would cover it. Scrollable past the cap. */
    max-height: 66px; overflow-y: auto; overscroll-behavior: contain;
    pointer-events: auto; z-index: 3;
  }
  .eq-task::-webkit-scrollbar { width: 6px; }
  .eq-task::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
  .eq-task b { color: #18181b; margin-right: 10px; }
  .eq-task em {
    display: block; margin-top: 2px; font-style: normal;
    font: 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #8a9099;
  }
  /* ---- the answer, pinned at the bottom ----------------------------- */
  .eq-result {
    position: absolute; left: 18px; bottom: 30px;
    max-width: min(560px, calc(100% - 36px));
    padding: 9px 14px 10px;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid #e2e4e7; border-left: 3px solid #3f9c20; border-radius: 6px;
    font: 12px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #24303a; pointer-events: none;
    box-shadow: 0 2px 10px rgba(20, 20, 30, 0.07);
  }
  .eq-result .res-h {
    font: 700 10px/1 inherit; letter-spacing: 0.1em; text-transform: uppercase;
    color: #3f9c20; margin-bottom: 4px;
  }

  /* ---- step caption card, top-left like the reference video --------- */
  .eq-caption {
    position: absolute; top: 14px; left: 18px;
    /* an exercise view pins its task across the top; the card sits under it */
    width: max-content;
    max-width: min(430px, calc(100% - 36px));
    /* CAPPED, and scrollable past the cap. Every view composes its drawing
       around this card, and a card whose height follows its text is a card
       nobody can compose around: one long caption and the load arrows are
       buried. 34% of the canvas is about eight lines, which is as much as
       anyone reads in one glance anyway.
       web/tools/regress/occlusion.py --live measures the real rectangle at
       every step and will say so if this stops being true. */
    max-height: 30%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 11px 15px 10px;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid #ececef; border-radius: 8px;
    box-shadow: 0 2px 14px rgba(20, 20, 30, 0.09);
    pointer-events: auto;                 /* so the overflow can be scrolled */
  }
  .eq-caption::-webkit-scrollbar { width: 6px; }
  .eq-caption::-webkit-scrollbar-thumb {
    background: #d4d4d8; border-radius: 3px;
  }

  /* ---- progress bar of the complete drawing (scrubbable) ------------ */
  .eq-progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 14px; cursor: pointer;
    background: linear-gradient(to top, #f0f0f2 8px, transparent 8px);
  }
  .eq-progress .fill {
    position: absolute; left: 0; bottom: 0;
    height: 8px; width: 0;
    background: var(--pink);
    transition: width 0.25s ease;
  }
  .eq-caption .cap-head {
    display: flex; gap: 18px; align-items: baseline; justify-content: space-between;
  }
  .eq-caption .pill {
    flex: none;
    font: 650 11px/1 ui-monospace, Menlo, Consolas, monospace;
    color: var(--pink);
  }
  .eq-caption .cap-t {
    font-weight: 700; font-size: 13px;
    letter-spacing: 0.02em; text-transform: uppercase; color: #18181b;
  }
  .eq-caption .cap-d, .eq-caption .cap-x {
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #3f3f46; margin-top: 3px;
  }
  .eq-caption .cap-x { margin-top: 0; }
  .eq-caption .cap-take {
    font: 600 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--pink); margin-top: 5px;
  }

  #viewport.has-task .eq-caption { top: 76px; }

  #error {
    position: absolute; inset: 0; display: none; place-content: center;
    text-align: center; color: var(--muted); font-size: 14px;
  }
</style>
<script type="importmap">
  { "imports": { "three": "./lib/vendor/three.module.js" } }
</script>
</head>
<body>
  <aside id="sidebar"></aside>
  <main id="viewport"><div id="error"></div></main>

  <script type="module">
    import { Drawing, Panel, StepPlayer } from './lib/eqdraw.js';

    // two wings: the drawings (?view=N -> views/view_N.js) and the course
    // exercises (?ex=S_T -> views/exS_T.js, listed in exercises.json)
    const qs = new URLSearchParams(location.search);
    const exId = qs.get('ex');
    const isEx = exId !== null;
    const id = isEx ? exId : (qs.get('view') ?? '1');

    // ---- view navigation (prev / dropdown / next) --------------------
    // The view ids come from views.json; static hosts (GitHub Pages) serve no
    // directory listing, so that listing is only a fallback for a dev server
    // whose views.json has gone stale.
    let views = [];
    let exMeta = null;
    if (isEx) {
      try {
        exMeta = await (await fetch('./exercises.json')).json();
        views = exMeta.views.map((v) => v.id);
      } catch { views = [id]; }
    } else {
      try {
        views = await (await fetch('./views.json')).json();
      } catch {
        try {
          const html = await (await fetch('./views/')).text();
          views = [...new Set([...html.matchAll(/view_(\d+)\.js/g)].map((m) => +m[1]))]
            .sort((a, b) => a - b);
        } catch { /* no listing available */ }
      }
    }

    const cur = isEx ? views.indexOf(id) : views.indexOf(+id);
    const goto = (n) => { location.search = isEx ? `?ex=${n}` : `?view=${n}`; };
    const nav = document.createElement('div');
    nav.id = 'viewnav';
    nav.innerHTML = `
      <button class="btn" id="nav-prev" title="Previous view (PageUp)">‹</button>
      <select id="nav-select" title="Jump to view">
        ${views.map((n) => `<option value="${n}" ${String(n) === String(id) ? 'selected' : ''}>${
          isEx ? 'Exercise ' + String(n).replace('_', '.') : 'View ' + n}</option>`).join('')}
      </select>
      <button class="btn" id="nav-next" title="Next view (PageDown)">›</button>
      <button class="btn" id="nav-grid" title="All views" onclick="location.href='${
        isEx ? 'exercises.html' : 'gallery.html'}'">⊞</button>`;
    document.getElementById('sidebar').appendChild(nav);
    const prev = nav.querySelector('#nav-prev');
    const next = nav.querySelector('#nav-next');
    prev.disabled = cur <= 0;
    next.disabled = cur === views.length - 1;
    prev.addEventListener('click', () => goto(views[cur - 1]));
    next.addEventListener('click', () => goto(views[cur + 1]));
    nav.querySelector('#nav-select').addEventListener('change', (e) => goto(e.target.value));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'PageDown' && cur < views.length - 1) { e.preventDefault(); goto(views[cur + 1]); }
      else if (e.key === 'PageUp' && cur > 0) { e.preventDefault(); goto(views[cur - 1]); }
    });

    try {
      const mod = await import(isEx ? `./views/ex${id}.js` : `./views/view_${id}.js`);
      document.title = mod.meta.title;
      const dw = new Drawing(document.getElementById('viewport'), mod.meta);
      const panel = new Panel(document.getElementById('sidebar'), mod.meta);
      // __player / __dw are used by tools (movie rendering, checks) to
      // drive the steps and inspect element geometry
      window.__dw = dw;
      window.__player = mod.create(dw, panel,
        (steps, refresh) => new StepPlayer(dw, panel, steps, refresh));
      // Every view gets the two escape hatches, so a reader is never stuck
      // with the drawing under a caption card or a slider dragged too far.
      // Views that already add their own keep theirs; this only fills gaps.
      if (![...panel.root.querySelectorAll('button')].some((b) => b.textContent === 'zoom fit')) {
        const sec = panel.section('View');
        panel.button(sec, 'zoom fit', () => dw.zoomFit());
        panel.button(sec, 'reset the drawing', () => {
          window.__player.set(0);
          dw.zoomFit();
        });
      }
      // ops-database export (tools/export_ops.py -> drawings/python)
      window.__exportOps = () => dw.exportOps(mod.meta, window.__player);
      // regression hook: the drawing keeps {k, d, state} from the last apply,
      // so a test can poke the state, refresh, and read the answer back out
      // (web/tools/regress/live.py). Read-only for anything but tests.
      window.__dw = dw;
      window.__set = (patch) => {
        Object.assign(dw._lastApply.state, patch);
        window.__player.refresh();
        return dw._lastApply.d;
      };

      // recreate-in-python links (the ops database, see drawings/python/)
      // the exercise wing: link straight back to the real course sheet
      if (isEx && exMeta) {
        const v = exMeta.views.find((x) => x.id === id);
        const sh = v && exMeta.sheets[v.sheet];
        if (sh) {
          const banner = document.createElement('div');
          banner.className = 'eq-task';
          banner.innerHTML = `<b>${sh.code} · Task ${v.n ?? ''} — ${v.title}</b>
            <span>${v.task}</span>${v.given ? `<em>${v.given}</em>` : ''}`;
          const vp = document.getElementById('viewport');
          vp.appendChild(banner);
          vp.classList.add('has-task');
          const sec = panel.section('The exercise');
          const link = (u, t) => (u ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : '');
          sec.innerHTML += `<p class="about"><b>${sh.code} · ${sh.title}</b><br>${v.task}</p>
            <p class="pylinks">${[link(sh.task_en, 'task (EN)'), link(sh.task_de, 'Aufgabe (DE)'),
              link(sh.solution_en || sh.solution_de, 'official solution'),
              link(sh.lecture, 'lecture ↗')].filter(Boolean).join(' · ')}</p>`;
        }
      }

      const gh = 'https://github.com/BRG-teaching/Teaching/blob/main/2_computational_form_finding/Equilibrium/drawings/python';
      const py = panel.section('Recreate in Python');
      const opsName = isEx ? `ex${id}` : `view_${id}`;
      py.innerHTML += `<p class="about">this drawing as a series of COMPAS drawing
        operations — geometry, color, width and construction step of every element:</p>
        <p class="pylinks">
          <a href="../python/ops/${opsName}.json">${opsName}.json</a> ·
          <a href="${gh}/recipes/${opsName}_draw.py">${opsName}_draw.py</a> ·
          <a href="${gh.replace('/blob/', '/tree/')}">the python package</a>
        </p>`;
    } catch (err) {
      const el = document.getElementById('error');
      el.style.display = 'grid';
      el.textContent = `Could not load view ${id}: ${err.message}`;
      throw err;
    }
  </script>
</body>
</html>
