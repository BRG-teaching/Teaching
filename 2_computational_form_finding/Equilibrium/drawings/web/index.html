<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eQUILIBRIUM drawings</title>
<style>
  :root {
    --pink: #ce4095;
    --border: #e4e4e7;
    --text: #27272a;
    --muted: #71717a;
    --panel: #16181d;
    --panel-2: #22252b;
    --panel-border: #33373f;
    --panel-text: #d5d7db;
    --panel-muted: #8a8f98;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    font: 13px/1.45 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #111;
    background: #fff;
    overflow: hidden;
  }

  /* ---- sidebar: dark panel as in the reference video ---------------- */
  #sidebar {
    width: 250px;
    flex: none;
    overflow-y: auto;
    padding-bottom: 24px;
    background: var(--panel);
    color: var(--panel-text);
  }
  .panel-head { padding: 18px 16px 6px; }
  .panel-head h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
  .panel-head p { color: var(--panel-muted); font-size: 12px; margin-top: 3px; }
  .about { color: var(--panel-muted); font-size: 12px; line-height: 1.5; padding-bottom: 6px; }
  .panel-section { padding: 14px 16px 4px; border-top: 1px solid var(--panel-border); margin-top: 14px; }
  .panel-section h2 {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--panel-muted); margin-bottom: 10px;
  }
  .ctl { margin-bottom: 10px; }
  .ctl-head { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .ctl-head .val { color: var(--panel-muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--pink); }
  .ctl.toggle { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .ctl.toggle input { accent-color: var(--pink); }
  .btn {
    font: 11px/1 inherit; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    padding: 8px 10px; margin: 0 6px 8px 0;
    border: 1px solid var(--panel-border); border-radius: 0;
    background: var(--panel-2); color: var(--panel-text); cursor: pointer;
  }
  .btn:hover { border-color: #6a707b; }
  .btn.accent { border-color: var(--pink); color: #ff7ec4; font-weight: 700; }
  .btn-row { display: flex; flex-wrap: wrap; }
  .btn-row .btn { flex: 1; margin-right: 6px; text-align: center; }
  .btn-row .btn:last-child { margin-right: 0; }

  /* ---- view navigation ---------------------------------------------- */
  #viewnav {
    display: flex; gap: 6px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--panel-border);
  }
  #viewnav .btn { margin: 0; flex: none; padding: 6px 9px; }
  #viewnav .btn:disabled { opacity: 0.35; cursor: default; }
  #viewnav select {
    flex: 1; min-width: 0;
    font: 12px/1 inherit; font-weight: 500;
    padding: 6px 6px; border: 1px solid var(--panel-border); border-radius: 0;
    background: var(--panel-2); color: var(--panel-text); cursor: pointer;
  }

  /* ---- viewport ----------------------------------------------------- */
  #viewport { position: relative; flex: 1; min-width: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; }
  .eq-overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .eq-label {
    position: absolute; transform: translate(-50%, -50%);
    font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #55555c; white-space: nowrap;
  }
  .eq-label.title { font-size: 14px; font-weight: 650; color: #18181b; }
  .eq-label.point { font-size: 11px; color: #a0a0a7; }
  .eq-label.num { font-weight: 700; color: #18181b; }
  .eq-label.flash { color: #111; font-weight: 700; }
  .eq-label.hover { color: #c99700; }

  /* ---- step caption: what the current step means, at the bottom ----- */
  .eq-caption {
    position: absolute; bottom: 26px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px; align-items: flex-start;
    width: max-content;
    max-width: min(640px, calc(100% - 32px));
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #111; border-radius: 0;
    pointer-events: none;
  }

  /* ---- progress bar of the complete drawing (scrubbable) ------------ */
  .eq-progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 14px; cursor: pointer;
    background: linear-gradient(to top, #f0f0f2 8px, transparent 8px);
  }
  .eq-progress .fill {
    position: absolute; left: 0; bottom: 0;
    height: 8px; width: 0;
    background: var(--pink);
    transition: width 0.25s ease;
  }
  .eq-caption .pill {
    flex: none; margin-top: 1px;
    font: 650 11px/1 ui-monospace, Menlo, Consolas, monospace;
    color: #fff; background: var(--pink);
    padding: 4px 7px; border-radius: 99px;
  }
  .eq-caption .cap-t { font-weight: 650; font-size: 13px; }
  .eq-caption .cap-d {
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: var(--muted); margin-top: 2px;
  }

  #error {
    position: absolute; inset: 0; display: none; place-content: center;
    text-align: center; color: var(--muted); font-size: 14px;
  }
</style>
<script type="importmap">
  { "imports": { "three": "./lib/vendor/three.module.js" } }
</script>
</head>
<body>
  <aside id="sidebar"></aside>
  <main id="viewport"><div id="error"></div></main>

  <script type="module">
    import { Drawing, Panel, StepPlayer } from './lib/eqdraw.js';

    const id = new URLSearchParams(location.search).get('view') ?? '1';

    // ---- view navigation (prev / dropdown / next) --------------------
    // Discover the available views from the dev server's directory
    // listing; fall back to 1..54 if it can't be parsed.
    let views = [];
    try {
      const html = await (await fetch('./views/')).text();
      views = [...new Set([...html.matchAll(/view_(\d+)\.js/g)].map((m) => +m[1]))]
        .sort((a, b) => a - b);
    } catch { /* no listing available */ }
    if (!views.length) views = Array.from({ length: 54 }, (_, i) => i + 1);

    const cur = views.indexOf(+id);
    const goto = (n) => { location.search = `?view=${n}`; };
    const nav = document.createElement('div');
    nav.id = 'viewnav';
    nav.innerHTML = `
      <button class="btn" id="nav-prev" title="Previous view (PageUp)">‹</button>
      <select id="nav-select" title="Jump to view">
        ${views.map((n) => `<option value="${n}" ${n === +id ? 'selected' : ''}>View ${n}</option>`).join('')}
      </select>
      <button class="btn" id="nav-next" title="Next view (PageDown)">›</button>
      <button class="btn" id="nav-grid" title="All views" onclick="location.href='gallery.html'">⊞</button>`;
    document.getElementById('sidebar').appendChild(nav);
    const prev = nav.querySelector('#nav-prev');
    const next = nav.querySelector('#nav-next');
    prev.disabled = cur <= 0;
    next.disabled = cur === views.length - 1;
    prev.addEventListener('click', () => goto(views[cur - 1]));
    next.addEventListener('click', () => goto(views[cur + 1]));
    nav.querySelector('#nav-select').addEventListener('change', (e) => goto(e.target.value));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'PageDown' && cur < views.length - 1) { e.preventDefault(); goto(views[cur + 1]); }
      else if (e.key === 'PageUp' && cur > 0) { e.preventDefault(); goto(views[cur - 1]); }
    });

    try {
      const mod = await import(`./views/view_${id}.js`);
      document.title = mod.meta.title;
      const dw = new Drawing(document.getElementById('viewport'), mod.meta);
      const panel = new Panel(document.getElementById('sidebar'), mod.meta);
      // __player / __dw are used by tools (movie rendering, checks) to
      // drive the steps and inspect element geometry
      window.__dw = dw;
      window.__player = mod.create(dw, panel,
        (steps, refresh) => new StepPlayer(dw, panel, steps, refresh));
    } catch (err) {
      const el = document.getElementById('error');
      el.style.display = 'grid';
      el.textContent = `Could not load view ${id}: ${err.message}`;
      throw err;
    }
  </script>
</body>
</html>
