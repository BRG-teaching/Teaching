<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eQUILIBRIUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font: 400 15px/1.4 Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #111;
    background: #eef0f2;
  }
  header {
    background: #16181d;
    color: #fff;
  }
  header .inner {
    max-width: 1520px;
    margin: 0 auto;
    padding: 36px 40px 30px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header h1 .q { color: #ce4095; }
  header .sub {
    font-size: 14px;
    color: #8a8f98;
    margin-top: 6px;
  }
  header .count {
    font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #8a8f98;
  }
  #grid {
    max-width: 1520px;
    margin: 0 auto;
    padding: 32px 40px 80px;
    display: grid;
    gap: 24px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid #e2e4e8;
    border-radius: 4px;
    box-shadow: 0 1px 3px rgba(20, 24, 32, 0.05);
    padding: 16px 16px 18px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .card:hover {
    border-color: #cfd3d9;
    box-shadow: 0 4px 14px rgba(20, 24, 32, 0.1);
  }
  .thumb {
    aspect-ratio: 5 / 3;
    background: #fff;
    display: grid;
    place-content: center;
    margin-bottom: 14px;
  }
  .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .placeholder {
    width: 26px; height: 26px;
    border: 1px solid #d9d9d9;
    border-radius: 50%;
  }
  .meta { display: flex; gap: 12px; align-items: baseline; }
  .meta .n {
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #999;
    min-width: 20px;
  }
  .meta .t {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .card:hover .t { text-decoration: underline; text-underline-offset: 3px; }
  .meta .txt { min-width: 0; }
  .meta .d {
    margin-top: 5px;
    font-size: 13px;
    line-height: 1.45;
    color: #6b7078;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card.todo .t { color: #b3b3b3; font-weight: 400; }
  .card.todo:hover .t { text-decoration: none; }
</style>
</head>
<body>
  <header>
    <div class="inner">
      <div>
        <h1>e<span class="q">QUILIBRIUM</span></h1>
        <p class="sub">an interactive environment for graphic statics-based structural design</p>
      </div>
      <span class="count" id="count"></span>
    </div>
  </header>
  <div id="grid"></div>

  <script type="module">
    const grid = document.getElementById('grid');

    // discover the available views from the dev server's directory listing
    let views = [];
    try {
      const html = await (await fetch('./views/')).text();
      views = [...new Set([...html.matchAll(/view_(\d+)\.js/g)].map((m) => +m[1]))]
        .sort((a, b) => a - b);
    } catch { views = Array.from({ length: 54 }, (_, i) => i + 1); }
    document.getElementById('count').textContent = `${views.length} drawings`;

    // autoplay the construction loops like GIFs; pause the off-screen ones
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) e.target.play().catch(() => {});
        else e.target.pause();
      }
    }, { rootMargin: '120px' });

    for (const n of views) {
      const card = document.createElement('a');
      card.className = 'card todo';
      card.href = `./?view=${n}`;
      card.innerHTML = `
        <div class="thumb"><div class="placeholder"></div></div>
        <div class="meta"><span class="n">${String(n).padStart(2, '0')}</span>
          <span class="txt"><span class="t">View ${n}</span></span></div>`;
      grid.appendChild(card);

      // title + one-sentence description from the view module's meta
      // (fetched as text, no evaluation)
      fetch(`./views/view_${n}.js`).then((r) => r.text()).then((src) => {
        const m = src.match(/title:\s*'([^']+)'/);
        if (m) {
          card.querySelector('.t').textContent =
            m[1].replace(/\\'/g, "'").replace(/^Drawing \d+\s+—\s+/, '');
        }
        const a = src.match(/about:\s*'((?:\\'|[^'])+)'/);
        if (a) {
          let text = a[1].replace(/\\'/g, "'");
          text = (text.match(/^.*?[.!?](?=\s|$)/) || [text])[0].trim();
          if (text.length > 140) {
            text = text.slice(0, 140).replace(/\s+\S*$/, '') + '…';
          }
          const d = document.createElement('span');
          d.className = 'd';
          d.textContent = text;
          card.querySelector('.txt').appendChild(d);
        }
        if (!src.startsWith('// Auto-generated')) card.classList.remove('todo');
      }).catch(() => {});

      // the construction loops continuously, GIF-style (poster paints first)
      fetch(`./movies/view_${n}.mp4`, { method: 'HEAD' }).then((r) => {
        if (!r.ok) return;
        const v = document.createElement('video');
        v.muted = true;
        v.loop = true;
        v.autoplay = true;
        v.playsInline = true;
        v.preload = 'auto';
        v.poster = `./movies/view_${n}.png`;
        v.src = `./movies/view_${n}.mp4`;
        const thumb = card.querySelector('.thumb');
        thumb.textContent = '';
        thumb.appendChild(v);
        io.observe(v);
      }).catch(() => {});
    }
  </script>
</body>
</html>
