<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eQUILIBRIUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font: 400 15px/1.4 Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #111;
    background: #eef0f2;
  }
  /* Header stripe = brg.ethz.ch app bar: v-toolbar bg-primary, rgb(33,150,234), white text */
  header {
    background: #2196ea;
    color: #fff;
  }
  header .inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 36px 40px 30px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header .sub {
    font-size: 14px;
    color: #fff;
    margin-top: 6px;
  }
  header .count {
    font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: rgba(255, 255, 255, 0.72);
  }
  /* Tile CSS copied from brg.ethz.ch/research/theses (Vuetify v-card flat rounded="0"):
     no border, no border-radius, no box-shadow; edge-to-edge image; 24px gutters;
     v-card-text 1rem padding; Roboto text-body-1/-2 typography. */
  /* Columns follow Vuetify's breakpoints as on brg.ethz.ch (v-col cols=12 sm=6 md=4):
     1 column below 600px, 2 from 600px, 3 from 960px (container capped at 1440px).
     Type sizes are constant at every width, as on brg.ethz.ch (no clamp/vw, root 16px). */
  #grid {
    max-width: 1440px;
    margin: 0 auto;
    padding: 48px 40px 64px;
    display: grid;
    gap: 24px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 600px) { #grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { #grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 599.98px) {
    #grid { padding: 24px 16px 48px; }
    header .inner { padding: 28px 16px 24px; }
  }
  .card {
    display: block;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: none;
    border-radius: 0;
    box-shadow: none;
    padding: 0;
    transition-property: box-shadow, opacity, background;
    transition-duration: 0.28s;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }
  .thumb {
    aspect-ratio: 660 / 430;
    background: #fff;
    display: grid;
    place-content: center;
    overflow: hidden;
  }
  .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .placeholder {
    width: 26px; height: 26px;
    border: 1px solid #d9d9d9;
    border-radius: 50%;
  }
  .meta { padding: 24px 16px 32px; cursor: pointer; }
  .meta .t {
    display: block;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.03125em;
    color: #2196ea;
  }
  .meta .txt { min-width: 0; }
  .meta .d {
    display: block;
    margin-top: 8px;
    font-size: 0.875rem;
    font-weight: 400;
    line-height: 1.425;
    letter-spacing: 0.0178571429em;
    color: #455b6b;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card { cursor: pointer; }
  .card.todo .t { color: #b3b3b3; font-weight: 400; }
</style>
</head>
<body>
  <header>
    <div class="inner">
      <div>
        <h1>e<span class="q">QUILIBRIUM</span></h1>
        <p class="sub">an interactive environment for graphic statics-based structural design</p>
      </div>
      <span class="count" id="count"></span>
    </div>
  </header>
  <div id="grid"></div>

  <script type="module">
    const grid = document.getElementById('grid');

    // The view ids come from views.json; static hosts (GitHub Pages) serve no
    // directory listing, so that listing is only a fallback for a dev server
    // whose views.json has gone stale. Regenerate with:
    //   ls views/*.js | sed 's/.*view_\([0-9]*\)\.js/\1/' | sort -n \
    //     | paste -sd, - | sed 's/^/[/; s/$/]/' > views.json
    let views = [];
    try {
      views = await (await fetch('./views.json')).json();
    } catch {
      const html = await (await fetch('./views/')).text();
      views = [...new Set([...html.matchAll(/view_(\d+)\.js/g)].map((m) => +m[1]))]
        .sort((a, b) => a - b);
    }
    document.getElementById('count').textContent = `${views.length} drawings`;

    // autoplay the construction loops like GIFs; pause the off-screen ones
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) e.target.play().catch(() => {});
        else e.target.pause();
      }
    }, { rootMargin: '120px' });

    for (const n of views) {
      const card = document.createElement('a');
      card.className = 'card todo';
      card.href = `./?view=${n}`;
      card.innerHTML = `
        <div class="thumb"><div class="placeholder"></div></div>
        <div class="meta"><span class="txt"><span class="t">View ${n}</span></span></div>`;
      grid.appendChild(card);

      // title + one-sentence description from the view module's meta
      // (fetched as text, no evaluation)
      fetch(`./views/view_${n}.js`).then((r) => r.text()).then((src) => {
        const m = src.match(/title:\s*'([^']+)'/);
        if (m) {
          card.querySelector('.t').textContent =
            m[1].replace(/\\'/g, "'").replace(/^Drawing \d+\s+—\s+/, '');
        }
        const a = src.match(/about:\s*'((?:\\'|[^'])+)'/);
        if (a) {
          let text = a[1].replace(/\\'/g, "'");
          text = (text.match(/^.*?[.!?](?=\s|$)/) || [text])[0].trim();
          if (text.length > 140) {
            text = text.slice(0, 140).replace(/\s+\S*$/, '') + '…';
          }
          const d = document.createElement('span');
          d.className = 'd';
          d.textContent = text;
          card.querySelector('.txt').appendChild(d);
        }
        if (!src.startsWith('// Auto-generated')) card.classList.remove('todo');
      }).catch(() => {});

      // the construction loops continuously, GIF-style (poster paints first)
      fetch(`./movies/view_${n}.mp4`, { method: 'HEAD' }).then((r) => {
        if (!r.ok) return;
        const v = document.createElement('video');
        v.muted = true;
        v.loop = true;
        v.autoplay = true;
        v.playsInline = true;
        v.preload = 'auto';
        v.poster = `./movies/view_${n}.png`;
        v.src = `./movies/view_${n}.mp4`;
        const thumb = card.querySelector('.thumb');
        thumb.textContent = '';
        thumb.appendChild(v);
        io.observe(v);
      }).catch(() => {});
    }
  </script>
</body>
</html>
