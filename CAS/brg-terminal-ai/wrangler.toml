# The BRG terminal's Claude service (see README.md). Deploy: npx wrangler deploy
name = "brg-terminal"
main = "src/worker.js"
compatibility_date = "2026-06-01"

[vars]
# The public R2 bucket of the BRG library (LIBRARY.md and the chapters)
LIBRARY_BASE = "https://pub-c082064d3c234b25bcb6abd4240e637c.r2.dev"
# Pages allowed to call this service, comma separated
ALLOWED_ORIGINS = "https://brg-teaching.github.io"
MODEL = "claude-opus-5-5"
# low | medium | high | xhigh | max: how hard Claude thinks; higher costs more
EFFORT = "high"

# Secrets, set once with `npx wrangler secret put NAME` (never in this file):
#   ANTHROPIC_API_KEY  the Anthropic API key that pays for the answers (required)
#   ACCESS_KEY         a key students type once with /key (recommended: without it anyone who
#                      finds this address can use your API key from a script)
