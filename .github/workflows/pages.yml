name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  # daily, so books newly published to the R2 library reach the CAS library page
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build gallery manifest
        run: python3 2_computational_form_finding/Equilibrium/drawings/web/tools/make_manifest.py
      - name: Copy the CAS library markdown from R2
        run: python3 CAS/website/tools/mirror_books.py CAS/website/books
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
