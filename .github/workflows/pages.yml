# When starter notebooks change, bump contentsStorageName in CAS/jupyter/jupyter-lite.json so browsers load the updates.

name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  # daily, so books newly published to the R2 library reach the CAS library page
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout the eQUILIBRIUM website
        uses: actions/checkout@v4
        with:
          ref: equilibrium
          path: .equilibrium-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /2_computational_form_finding/Equilibrium/drawings/web/
            /2_computational_form_finding/Equilibrium/drawings/python/
      - name: Set up Node for the Vue website
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install the Vue website dependencies
        run: npm ci --prefix website
      - name: Assemble the docs deployment
        run: |
          python3 tools/build_site.py --equilibrium .equilibrium-source
          rm -rf .equilibrium-source
      - name: Set up Python for JupyterLite
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: CAS/jupyter/requirements.txt
      - name: Build the browser notebook workspace
        run: |
          python -m pip install -r CAS/jupyter/requirements.txt
          jupyter lite build --lite-dir CAS/jupyter --contents ../website/notebooks --output-dir docs/CAS/website/jupyter --apps lab
      - name: Version the website and notebook URLs
        # New commit-specific URLs prevent cached website files, Jupyter HTML, or theme CSS from mixing versions.
        run: |
          v=${GITHUB_SHA::7}
          sed -i -E 's#(src|href)="(\./)?((gate|library-config|notebook-bridge|notebook-exercises|library|terminal-context)\.js|(style|library)\.css)"#\1="\2\3?v='"$v"'"#g' docs/CAS/website/index.html docs/CAS/website/library.html
          grep -c "?v=$v" docs/CAS/website/index.html docs/CAS/website/library.html
          grep -F "terminal-context.js?v=$v" docs/CAS/website/library.html
          grep -F "notebook-bridge.js?v=$v" docs/CAS/website/library.html
      - name: Copy the CAS library markdown from R2
        run: python3 CAS/website/tools/mirror_books.py docs/CAS/website/books
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
