name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  # daily, so books newly published to the R2 library reach the CAS library page
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for JupyterLite
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: CAS/jupyter/requirements.txt
      - name: Build the browser notebook workspace
        run: |
          python -m pip install -r CAS/jupyter/requirements.txt
          jupyter lite build --lite-dir CAS/jupyter --contents ../website/notebooks --output-dir CAS/website/jupyter --apps lab
      - name: Version the course website's own scripts and styles
        # each deploy gets new URLs (library.js?v=<commit>), so browsers never mix a cached old file with new ones
        run: |
          v=${GITHUB_SHA::7}
          sed -i -E 's#(src|href)="((gate|library-config|notebook-exercises|library)\.js|(style|library)\.css)"#\1="\2?v='"$v"'"#g' CAS/website/library.html
          sed -i "s#src: 'vendor/brg-claude.js'#src: 'vendor/brg-claude.js?v=$v'#" CAS/website/library.js
          grep -c "?v=$v" CAS/website/library.html CAS/website/library.js
      - name: Build gallery manifest
        run: python3 2_computational_form_finding/Equilibrium/drawings/web/tools/make_manifest.py
      - name: Copy the CAS library markdown from R2
        run: python3 CAS/website/tools/mirror_books.py CAS/website/books
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
